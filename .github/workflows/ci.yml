name: Validate music analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - name: Install packages
        run: Rscript -e 'install.packages(c("tidyverse", "readxl", "writexl", "FactoMineR", "factoextra", "corrplot", "car", "lmtest", "Hmisc", "modelsummary", "sandwich", "flextable", "officer"), repos="https://cloud.r-project.org")'
      - run: Rscript --vanilla tests/smoke.R
